databases:
  - name: betterme-db
    databaseName: betterme
    plan: free

services:
  # ---------------------------------------------------------------- AI agents
  # Python / FastAPI. Reached only by the API service, guarded by a shared secret.
  - type: web
    name: betterme-agents
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r services/agents/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir services/agents
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ANTHROPIC_API_KEY
        sync: false # set this in the Render dashboard
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: ANTHROPIC_FAST_MODEL
        value: claude-sonnet-5
      - key: AGENTS_SHARED_SECRET
        generateValue: true

  # ------------------------------------------------------------ API + web app
  # Node/Express serves the REST API and the built React bundle from one origin.
  - type: web
    name: betterme-api
    runtime: node
    plan: free
    region: oregon
    # --include=dev is required: NODE_ENV=production makes npm ci skip
    # devDependencies, which would drop tsc and vite and fail the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: betterme-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # 64 hex characters. Generate with: openssl rand -hex 32
      - key: ENCRYPTION_KEY
        sync: false
      - key: AGENTS_URL
        fromService:
          name: betterme-agents
          type: web
          property: host
      - key: AGENTS_SHARED_SECRET
        fromService:
          name: betterme-agents
          type: web
          envVarKey: AGENTS_SHARED_SECRET
      - key: ENABLE_SCHEDULER
        value: "true"
      # Bank connection — leave blank to run with manual expense entry only.
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
